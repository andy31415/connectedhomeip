## IDF component manager dependencies.
##
## Each board support package is only meaningful on the SoC of its board, so the
## rules keep it out of the other boards' dependency graphs.
dependencies:
    espressif/m5stack_core_s3:
        version: "^4.1"
        rules:
            - if: "target == esp32s3"

    ## Camera & WebRTC dependencies for ESP32-S3 / ESP32-P4.
    espressif/esp_peer:
        version: "~1.5.8"
        rules:
            - if: "idf_version >= 5.5"
            - if: "target in [esp32s3, esp32p4]"

    espressif/esp_h264:
        version: "~1.5.1"
        rules:
            - if: "idf_version >= 5.5"
            - if: "target in [esp32s3, esp32p4]"

    espressif/esp_new_jpeg:
        version: "~1.0.2"
        rules:
            - if: "idf_version >= 5.5"
            - if: "target in [esp32s3, esp32p4]"

    ## The Mosaico's USB-C port is the USB OTG controller: a CDC device carries the console.
    espressif/esp_tinyusb:
        version: "^3.0.0-rc2"
        rules:
            - if: "target == esp32s31"
